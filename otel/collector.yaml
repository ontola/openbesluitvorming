# OpenTelemetry collector for the production host. Receives OTLP from the
# Deno containers (OTEL_DENO=1 exports traces, metrics and console logs) and
# scrapes host metrics, then ships everything to SigNoz Cloud (eu2).
#
# The collector is the diagnosis/trend layer only; paging stays with
# scripts/monitor-production.sh, which runs independently of the app stack.
#
# Requires: pid: host and /:/hostfs:ro (see docker-compose.production.yml) so
# the process scraper can read /proc — process.open_file_descriptors is
# enabled explicitly to trend the July 2026 worker socket leak.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      network: {}
      filesystem:
        include_mount_points:
          match_type: strict
          mount_points: ["/"]
      process:
        # Only the processes we run; scraping every host process explodes
        # metric cardinality (and SigNoz Cloud bills per sample).
        include:
          match_type: regexp
          names: ["deno.*", "quickwit.*", "caddy.*"]
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
        metrics:
          process.open_file_descriptors:
            enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
  # "woozi-1" is cryptic in the SigNoz Infrastructure view; give the host its
  # public-facing name. Applies to app telemetry too so everything from this
  # machine groups under one readable host.
  resource:
    attributes:
      - key: host.name
        value: openbesluitvorming-server
        action: upsert
  # A visitor's search term travels in the URL -- both /api/search?query=... and
  # the page itself, /?query=... -- so the raw URL on an inbound span is a copy
  # of what someone typed into the search box. On a government information site
  # that is not neutral: people look up their own name, their address, their own
  # case. web/server.ts already keeps the term out of our own logs (it records a
  # hash and a length, never the text), but Deno's automatic HTTP
  # instrumentation attaches url.full and url.query by itself, straight past
  # that decision. Dropped here rather than per service: one place, every
  # signal that leaves this host.
  #
  # Server spans only. Outbound calls to iBabs and Notubiz carry date windows in
  # their query strings and no visitor data, and those are what you read when an
  # import goes wrong.
  transform/strip_visitor_queries:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.query") where kind == 2
          # "[?]" rather than an escaped "\?": OTTL string literals take no
          # backslash escape for it, and a character class means the same to RE2.
          - replace_pattern(attributes["url.full"], "[?].*", "") where kind == 2 and attributes["url.full"] != nil

  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  otlp:
    endpoint: ingest.eu2.signoz.cloud:443
    headers:
      signoz-ingestion-key: ${env:SIGNOZ_INGESTION_KEY}

service:
  telemetry:
    logs:
      level: warn
    metrics:
      # Expose the collector's own counters (accepted/sent/failed) on the
      # compose network for debugging: curl http://otel-collector:8888/metrics
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [memory_limiter, transform/strip_visitor_queries, resourcedetection, resource, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp]
