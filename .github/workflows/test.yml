name: Tests

# Nothing ran the test suite. Both existing workflows build and deploy, so a
# red suite reached production unnoticed -- it had been red for weeks before
# anyone looked. This gate runs the hermetic tests on every push and pull
# request.
#
# The live integration tests stay out: they need Docker, minio, the Notubiz API
# and the PDF extraction fleet, which is firewalled to the production host.
# Run those with WOOZI_RUN_LIVE_INTEGRATION=1 from a machine that can reach it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Keep in step with the runtime image in Dockerfile.web. 2.7.7 did not
          # type-check this codebase (aws4fetch's fetch signature resolved
          # without `method`, 9 errors in src/storage/s3.ts); 2.8.3 is clean.
          deno-version: 2.8.3

      - name: Check types
        run: deno check src/main.ts src/worker.ts web/server.ts

      - name: Run tests
        run: deno test -A tests/

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # pnpm comes from its own action, not from corepack: corepack downloads
      # pnpm on every run and that download tripped an undici assertion in
      # Node 24 ("assert(!this.paused)"), failing the job before a single
      # test ran. The version is pinned by package.json's packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build the front end
        run: pnpm run build:web

      # WCAG 2.1 A/AA check with axe-core on the public pages, against the
      # build above. Needs no Quickwit: the search API is mocked in the
      # browser. See scripts/a11y_check.mjs and scripts/a11y-baseline.json.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.3

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check accessibility
        run: pnpm run test:a11y

  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # CycloneDX SBOM of the dependencies syft finds in the repository's lock
      # files (pnpm-lock.yaml for the web app). Kept as a workflow artifact; the
      # published image carries its own SBOM attestation (publish workflow).
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
