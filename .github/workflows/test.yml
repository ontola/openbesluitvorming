name: Tests

# Nothing ran the test suite. Both existing workflows build and deploy, so a
# red suite reached production unnoticed -- it had been red for weeks before
# anyone looked. This gate runs the hermetic tests on every push and pull
# request.
#
# The live integration tests stay out: they need Docker, minio, the Notubiz API
# and the PDF extraction fleet, which is firewalled to the production host.
# Run those with WOOZI_RUN_LIVE_INTEGRATION=1 from a machine that can reach it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Deliberately NOT the 2.7.7 in Dockerfile.web. The codebase does not
          # type-check on 2.7.7: aws4fetch's fetch signature resolves without
          # `method` there, giving 9 errors in src/storage/s3.ts. Verified by
          # running deno check in both images — 2.7.7 fails, 2.8.3 is clean.
          #
          # Types are not enforced at runtime, so production is unaffected, but
          # the runtime image and the version developers run have drifted apart.
          # Worth closing by bumping Dockerfile.web; that is a change to what
          # runs in production and belongs in its own commit, not smuggled into
          # a CI fix.
          deno-version: 2.8.3

      - name: Check types
        run: deno check src/main.ts src/worker.ts web/server.ts

      - name: Run tests
        run: deno test -A tests/

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # pnpm comes from its own action, not from corepack: corepack downloads
      # pnpm on every run and that download tripped an undici assertion in
      # Node 24 ("assert(!this.paused)"), failing the job before a single
      # test ran. The version is pinned by package.json's packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Build the front end
        run: pnpm run build:web
