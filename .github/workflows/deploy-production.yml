name: Deploy Production

on:
  workflow_run:
    workflows:
      - Publish OpenBesluitvorming Image
    types:
      - completed

permissions:
  contents: read

# Two image builds finishing close together (rapid pushes) used to launch two
# deploys that raced each other's `docker compose up` on the host: the loser
# hit a container-name conflict and left the stack half-recreated with Caddy
# down (July 2026 outage). Serialize; never cancel a deploy that is already
# rewriting containers, and let the newest queued one supersede older waiters.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    # `beta` is the GitHub Environment name, which owns the deploy secret and
    # any protection rules. It is deliberately not renamed with the rest: that
    # name lives in GitHub's settings, not in this file, and changing it here
    # alone would deploy without the environment's secrets.
    environment: beta

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BETA_DEPLOY_SSH_KEY }}

      - name: Trust production host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 91.98.32.151 >> ~/.ssh/known_hosts

      - name: Deploy published image to production
        env:
          DEPLOY_REF: ${{ github.event.workflow_run.head_sha }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.event.workflow_run.repository.owner.login }}/openbesluitvorming
        run: |
          export DEPLOY_REF="${DEPLOY_REF:0:7}"
          bash scripts/deploy-production.sh
