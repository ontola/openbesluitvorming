services:
  caddy:
    image: caddy:2
    depends_on:
      - openbesluitvorming
    restart: unless-stopped
    # Relative CPU scheduling weight (default 1024), not a hard cap: lets
    # user-facing traffic stay responsive when the worker containers are
    # pegged at 100% CPU on this 4-vCPU host (July 2026: backfill workers
    # starved the web server enough that requests started timing out).
    cpu_shares: 2048
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  quickwit:
    # 0.9.0 rewrites the file metastore to its own format at startup and 0.8.1
    # will not read that back. Rolling back means restoring the indexes-prod
    # directory from the copy taken before the upgrade, not just the tag.
    # See docs/local-index-plan.md, step 1.
    image: quickwit/quickwit:0.9.0
    restart: unless-stopped
    command:
      - run
      - --config
      - /quickwit/config/quickwit.yaml
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_STORAGE_BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT}
      S3_STORAGE_REGION: ${S3_STORAGE_REGION}
      QUICKWIT_CLUSTER_ID: ${QUICKWIT_CLUSTER_ID:-woozi-prod}
      QUICKWIT_NODE_ID: ${QUICKWIT_NODE_ID:-quickwit-prod}
      QUICKWIT_INDEX_ROOT_PREFIX: ${QUICKWIT_INDEX_ROOT_PREFIX:-indexes-prod}
      # 40G -> 55G (2026-07-23) -> 120G (2026-07-31), briefly 70G on 2026-08-14
      # while the cache was moved to the root disk and back.
      #
      # The budget has to be generous relative to the largest single split,
      # not merely larger than the index. A split is cached whole, and the
      # served index is 60.8GB across 9 published splits with four of them
      # 12-18GB. Tried at 70G on the root disk (2026-08-14): the cache settled
      # at 9.6GB, taking the 14 small splits and refusing all four large ones
      # while 60GB of budget sat unused. At 120G the old cache had held a
      # 24.9GB split without trouble -- the same ratio of split to budget that
      # 70G denies.
      #
      # So this number is about the ratio, and the volume is what makes the
      # ratio affordable. This is the first thing to check when cold search
      # gets slow, along with the split sizes it has to accommodate: if merges
      # keep growing splits, the budget has to grow with them or the biggest
      # ones silently stop being cached. Smaller splits would remove the
      # problem rather than fund it.
      #
      # Rescaling the server was the obvious alternative but is not possible
      # here: fsn1-dc14 lists no affordable larger type in
      # available_for_migration, so the cheap big machines can only be had by
      # rebuilding onto a new server.
      QUICKWIT_SPLIT_CACHE_MAX_NUM_BYTES: ${QUICKWIT_SPLIT_CACHE_MAX_NUM_BYTES:-120G}
      QUICKWIT_SPLIT_CACHE_NUM_CONCURRENT_DOWNLOADS: ${QUICKWIT_SPLIT_CACHE_NUM_CONCURRENT_DOWNLOADS:-1}
    # Quickwit logs every search at INFO, including the full split list, and
    # Docker's json-file driver does not rotate unless told to. The log had
    # reached 1.2 GB on the root disk by the time anyone looked (2026-08-12),
    # growing fastest exactly when the disk is most under pressure. Three
    # rotations of 100 MB is more history than anyone reads.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    volumes:
      - quickwit-data:/quickwit/qwdata
      # Dedicated 150GB volume for the searcher split cache only. It holds no
      # durable state -- everything here is a local copy of splits that live in
      # S3 -- so it can be wiped or lost without data loss.
      #
      # This disk is slow: measured 2026-08-14, 4K random reads take 2.01ms
      # here against 0.22ms on the root disk's NVMe, which is 9x on exactly the
      # access pattern a term lookup performs. Moving the cache to root was
      # tried that day for precisely that reason and moved back, because the
      # root disk cannot spare enough space to hold the largest splits and an
      # uncached 18GB split is fetched from S3 -- far worse than a slow local
      # read. Capacity wins here as long as splits are this large.
      #
      # Worth revisiting if splits ever get smaller, or if the machine gets a
      # bigger root disk.
      - /mnt/quickwit-cache:/quickwit/qwdata/searcher-split-cache
      # The next projection index lives on the same volume, as a local
      # file:// index instead of an S3 index with a cache in front of it. The
      # worker creates it there through WORKER_QUICKWIT_INDEX_URI; this mount
      # is what makes that path land on /dev/sdb instead of the root disk
      # (which cannot hold a 60 GB index plus merge headroom -- see
      # docs/local-index-plan.md). Its metastore.json lands here too, because
      # metastore_uri and the index root share the indexes-prod prefix.
      - /mnt/quickwit-cache/indexes/woozi-events-v4:/quickwit/qwdata/indexes-prod/woozi-events-v4
      - ./quickwit/quickwit.yaml:/quickwit/config/quickwit.yaml:ro

  openbesluitvorming:
    image: ${OPENBESLUITVORMING_IMAGE:-ghcr.io/ontola/openbesluitvorming:main}
    pull_policy: missing
    depends_on:
      - quickwit
    restart: unless-stopped
    # See caddy's cpu_shares comment: same priority-under-contention reasoning.
    cpu_shares: 2048
    environment:
      DENO_V8_FLAGS: --max-old-space-size=1024
      PORT: 8787
      QUICKWIT_URL: http://quickwit:7280
      # Which index this container reads, and which projection it scopes
      # queries to. WOOZI_PROJECTION_VERSION used to be absent here entirely,
      # so setting it in .env reached nothing and the documented v3 cutover
      # would have been a no-op. Empty falls back to the code default.
      QUICKWIT_INDEX_ID: ${QUICKWIT_INDEX_ID:-woozi-events-prod}
      WOOZI_PROJECTION_VERSION: ${WOOZI_PROJECTION_VERSION:-}
      WOOZI_KV_PATH: /data/woozi-ops.sqlite3
      WOOZI_EXPORT_LOG_PATH: /data/woozi-export-log.sqlite3
      WOOZI_STATS_CACHE_PATH: /data/woozi-stats-cache.json
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_STORAGE_BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT}
      S3_STORAGE_REGION: ${S3_STORAGE_REGION}
      WOOZI_EXTRACTION_SERVICE_URL: ${WOOZI_EXTRACTION_SERVICE_URL:-}
      WOOZI_SCHEDULER_ENABLED: ${WOOZI_SCHEDULER_ENABLED:-1}
      OTEL_DENO: ${OTEL_DENO:-true}
      OTEL_SERVICE_NAME: woozi-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    expose:
      - "8787"
    volumes:
      - woozi-state:/data

  worker:
    image: ${OPENBESLUITVORMING_IMAGE:-ghcr.io/ontola/openbesluitvorming:main}
    pull_policy: missing
    depends_on:
      - quickwit
    restart: unless-stopped
    command: ["run", "-A", "src/worker.ts"]
    # Lower relative weight than caddy/openbesluitvorming (see their
    # cpu_shares comments): under contention the kernel favors user-facing
    # traffic, but workers can still burst to 100% of a core when the host
    # is otherwise idle -- this only reshuffles priority, not throughput.
    cpu_shares: 256
    environment:
      DENO_V8_FLAGS: --max-old-space-size=4096
      QUICKWIT_URL: http://quickwit:7280
      # The worker can be pointed at a different index than the one being
      # served, which is what makes a projection cutover possible without the
      # site going blank. Point the workers at the new index, reindex every
      # source into it while the web container keeps serving the old one, and
      # only switch the reader once the new index is verified. Both fall back
      # to the served values, so unset changes nothing.
      QUICKWIT_INDEX_ID: ${WORKER_QUICKWIT_INDEX_ID:-${QUICKWIT_INDEX_ID:-woozi-events-prod}}
      WOOZI_PROJECTION_VERSION: ${WORKER_PROJECTION_VERSION:-${WOOZI_PROJECTION_VERSION:-}}
      # Only consulted when the worker *creates* an index (a new id above).
      # Unset, the node's default_index_root_uri (S3) and the checked-in
      # commit_timeout_secs (1) apply -- both of which the next index must not
      # inherit. See docs/local-index-plan.md.
      QUICKWIT_INDEX_URI: ${WORKER_QUICKWIT_INDEX_URI:-}
      QUICKWIT_COMMIT_TIMEOUT_SECS: ${WORKER_QUICKWIT_COMMIT_TIMEOUT_SECS:-}
      # auto | wait_for | force. wait_for blocks each batch for a full
      # commit_timeout_secs; set auto for a corpus-wide reindex.
      QUICKWIT_INGEST_COMMIT: ${QUICKWIT_INGEST_COMMIT:-wait_for}
      QUICKWIT_BATCH_SIZE: ${QUICKWIT_BATCH_SIZE:-64}
      # iBabs rate limits are per IP address and the whole fleet shares one, so
      # each worker may only pace itself to its share of the budget. Without
      # this the workers each assume they are alone.
      WOOZI_IBABS_WORKERS: ${WOOZI_WORKER_REPLICAS:-1}
      WOOZI_KV_PATH: /data/woozi-ops.sqlite3
      WOOZI_EXPORT_LOG_PATH: /data/woozi-export-log.sqlite3
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_STORAGE_BUCKET_NAME: ${S3_STORAGE_BUCKET_NAME}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT}
      S3_STORAGE_REGION: ${S3_STORAGE_REGION}
      WOOZI_EXTRACTION_SERVICE_URL: ${WOOZI_EXTRACTION_SERVICE_URL:-}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-4}
      INGEST_MEMORY_PER_JOB_MB: ${INGEST_MEMORY_PER_JOB_MB:-1400}
      INGEST_MIN_FREE_MEMORY_MB: ${INGEST_MIN_FREE_MEMORY_MB:-1024}
      WOOZI_DOCUMENT_CONCURRENCY: ${WOOZI_DOCUMENT_CONCURRENCY:-3}
      WOOZI_IBABS_MOTION_CONCURRENCY: ${WOOZI_IBABS_MOTION_CONCURRENCY:-2}
      # iBabs throttles the SOAP endpoint with 403s. The client backs off four
      # times, doubling from this base.
      #
      # 5s was too far. It did cut motion loss from 2.2 to 0.75 per run, but a
      # blocked call then waits up to 75s, and under parallel load that
      # compounds until runs stall: three sources sat at 130 minutes with their
      # motion counts frozen. Optimising loss per run was the wrong objective —
      # imports are idempotent, so a cheaper run plus a mop-up pass beats a run
      # that never finishes. 3s keeps ~45s of patience without the stalling.
      WOOZI_IBABS_THROTTLE_BASE_MS: ${WOOZI_IBABS_THROTTLE_BASE_MS:-3000}
      # Fleet-wide brake, added after the motion backfill got the production IP
      # blocked outright on 2026-08-05 — SOAP, WSDL and the document host all
      # returned 403 for every source, not just the ones being backfilled.
      #
      # Per worker, so the fleet ceiling is this times the worker count: at 1
      # rps and four workers, four requests a second. Deliberately low; the
      # backfill is not urgent and a second block is far more expensive than a
      # slow import. The breaker path lives on the shared volume so a 403 seen
      # by one worker pauses all of them.
      # One rate for two budgets six times apart is necessarily wrong for one
      # of them, so pacing is now per endpoint and expressed as iBabs states
      # it: requests per minute for the whole address, divided across workers.
      WOOZI_IBABS_SOAP_PER_MINUTE: ${WOOZI_IBABS_SOAP_PER_MINUTE:-180}
      WOOZI_IBABS_DOWNLOAD_PER_MINUTE: ${WOOZI_IBABS_DOWNLOAD_PER_MINUTE:-30}
      WOOZI_IBABS_COOLDOWN_MS: ${WOOZI_IBABS_COOLDOWN_MS:-60000}
      WOOZI_IBABS_BREAKER_PATH: /data/ibabs-breaker.json
      OTEL_DENO: ${OTEL_DENO:-true}
      OTEL_SERVICE_NAME: woozi-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - woozi-state:/data

  # Diagnosis/trend telemetry to SigNoz Cloud; paging stays with
  # scripts/monitor-production.sh (independent failure domain). pid: host +
  # /:/hostfs:ro let the hostmetrics process scraper read /proc for the
  # per-process fd counts (worker socket leak, July 2026). Runs as root for
  # the same reason. No host ports: only containers on the compose network
  # can reach the OTLP endpoints.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    user: "0"
    pid: host
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      SIGNOZ_INGESTION_KEY: ${SIGNOZ_INGESTION_KEY:-}
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro

volumes:
  caddy-data:
  caddy-config:
  quickwit-data:
  woozi-state:
