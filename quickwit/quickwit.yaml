version: 0.7
cluster_id: ${QUICKWIT_CLUSTER_ID}
node_id: ${QUICKWIT_NODE_ID}
listen_address: 0.0.0.0
rest:
  listen_port: 7280
data_dir: /quickwit/qwdata
# The metastore is index *metadata* only — a few hundred KB — and stays local.
metastore_uri: file:///quickwit/qwdata/${QUICKWIT_INDEX_ROOT_PREFIX}
# Splits go to object storage, which is where the live index has always been
# (`woozi-events-prod` reports s3://…/indexes-prod/woozi-events-prod). This
# default said `file://`, so every index created *since* then wrote its splits
# to the root disk instead. That is not a small difference: the published index
# is ~65 GB and the root disk has ~60 GB free, so any newly created index —
# including the v3 projection — filled the disk and could never have finished,
# at any speed. Splits belong in S3; the searcher split cache on its own volume
# is what makes them fast to read.
default_index_root_uri: s3://${S3_STORAGE_BUCKET_NAME}/${QUICKWIT_INDEX_ROOT_PREFIX}
storage:
  s3:
    endpoint: ${S3_STORAGE_ENDPOINT}
    region: ${S3_STORAGE_REGION}
    force_path_style_access: true
searcher:
  fast_field_cache_capacity: ${QUICKWIT_FAST_FIELD_CACHE_CAPACITY:-1G}
  split_footer_cache_capacity: ${QUICKWIT_SPLIT_FOOTER_CACHE_CAPACITY:-512M}
  partial_request_cache_capacity: ${QUICKWIT_PARTIAL_REQUEST_CACHE_CAPACITY:-128M}
  # No split_cache section, on purpose. The searcher split cache wraps every
  # storage, file:// included (checked in quickwit-search/src/leaf.rs and
  # measured on 0.9.0), so with a local index it would copy each split from
  # the index directory into a cache directory on the same disk. Setting
  # max_num_bytes to 0 does not disable it; leaving the section out does.
